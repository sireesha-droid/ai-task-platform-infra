version: "3.9"

# ─── Common Configuration ──────────────────────────────────────────────────────
x-backend-env: &backend-env
  NODE_ENV: development
  PORT: "5000"
  MONGODB_URI: mongodb://mongo:27017/ai-task-platform
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: dev-secret-change-in-production
  JWT_EXPIRES_IN: "7d"
  FRONTEND_URL: "*"
  LOG_LEVEL: info

x-worker-env: &worker-env
  MONGODB_URI: mongodb://mongo:27017/ai-task-platform
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  LOG_LEVEL: INFO

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    container_name: atp-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - atp-net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: atp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - atp-net

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atp-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - atp-net

  # ── Python Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: atp-worker
    restart: unless-stopped
    environment:
      <<: *worker-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atp-net

  # ── Frontend ──────────────────────────────────────────────────────────────────
  # IMPORTANT for EC2: The REACT_APP_API_URL must be your EC2 public IP
  # because React runs in the BROWSER, not in Docker.
  # Change the value below to: http://<your-ec2-public-ip>:5000/api
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://YOUR_EC2_PUBLIC_IP:5000/api
    container_name: atp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atp-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
  redis-data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  atp-net:
    driver: bridge
