apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongo-service:27017/ai-task-platform"
  JWT_EXPIRES_IN: "7d"
  LOG_LEVEL: "info"
  FRONTEND_URL: "https://ai-tasks.yourdomain.com"
  # Python worker
  PYTHONUNBUFFERED: "1"
