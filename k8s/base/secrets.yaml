# IMPORTANT: In production, use Sealed Secrets or External Secrets Operator
# to inject real secrets. Never commit real secrets to git.
# The values below are base64-encoded placeholders.
#
# To encode: echo -n "your-secret" | base64
# To decode: echo "base64-string" | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-task-platform
type: Opaque
data:
  # Replace with: echo -n "your-strong-jwt-secret" | base64
  JWT_SECRET: Y2hhbmdlLXRoaXMtdG8tYS1zdHJvbmctcmFuZG9tLXNlY3JldA==
  # Replace with: echo -n "your-redis-password" | base64
  REDIS_PASSWORD: ""
