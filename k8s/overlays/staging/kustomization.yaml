apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit all base resources
resources:
  - ../../base

# Override namespace for staging
namespace: ai-task-platform-staging

# Patch replica counts down for staging
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Lower resource limits for staging
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
  # Override HPA max replicas
  - target:
      kind: HorizontalPodAutoscaler
      name: worker-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

# Override configmap values for staging
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
      - FRONTEND_URL=https://staging.ai-tasks.yourdomain.com

# Add staging suffix to all resource names to avoid clashes
nameSuffix: "-staging"
